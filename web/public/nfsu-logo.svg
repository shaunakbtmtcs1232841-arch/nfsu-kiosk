<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0B738" />
      <stop offset="50%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#8E6F14" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143A66" />
      <stop offset="100%" stop-color="#07172C" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="120" cy="120" r="105" fill="url(#navyGrad)" stroke="#C9A227" stroke-width="2" />
  
  <!-- Text Ring -->
  <path id="textPath" d="M 30,120 A 90,90 0 1,1 210,120" fill="none" />
  <text font-family="Cinzel, Georgia, serif" font-size="12.5" font-weight="700" fill="#E0B738" letter-spacing="2">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      NATIONAL FORENSIC SCIENCES UNIVERSITY
    </textPath>
  </text>
  
  <!-- Bottom Text -->
  <path id="textPathBottom" d="M 205,125 A 85,85 0 0,1 35,125" fill="none" />
  <text font-family="sans-serif" font-size="11" font-weight="700" fill="#E0B738" letter-spacing="3">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      LIBRARY SERVICES • GANDHINAGAR
    </textPath>
  </text>
  
  <!-- Inner Shield / Emblem -->
  <circle cx="120" cy="120" r="68" fill="#0B2545" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Scales of Justice & Book Symbol -->
  <!-- Open Book -->
  <path d="M 85,135 Q 120,125 120,145 Q 120,125 155,135 L 155,155 Q 120,145 120,165 Q 120,145 85,155 Z" fill="#E0B738" />
  <path d="M 120,130 L 120,165" stroke="#0B2545" stroke-width="2" />
  
  <!-- Scales of Justice -->
  <path d="M 120,80 L 120,125" stroke="#C9A227" stroke-width="3" stroke-linecap="round" />
  <path d="M 92,93 L 148,93" stroke="#C9A227" stroke-width="3" stroke-linecap="round" />
  <!-- Left Pan -->
  <path d="M 92,93 L 80,110 L 104,110 Z" fill="none" stroke="#C9A227" stroke-width="2" />
  <!-- Right Pan -->
  <path d="M 148,93 L 136,110 L 160,110 Z" fill="none" stroke="#C9A227" stroke-width="2" />
  <!-- Top Finial -->
  <circle cx="120" cy="76" r="4" fill="#E0B738" />
</svg>
